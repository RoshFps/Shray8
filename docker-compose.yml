# Describes the containers that make up the app and how they connect.
# First time:  scripts/init-env.sh   then   docker compose up --build -d
#
# caddy              HTTPS + login; the only thing published to the network (80/443)
# backend            dashboard + API + SQLite (data in the "dashboard-data" volume); not published
# endpoint-<dept>    Linux collector containers, one compose network per department.
#                    Scale a department with:  docker compose up -d --scale endpoint-it=5

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  logging: *logging
  restart: unless-stopped

services:
  caddy:
    <<: *hardened
    image: caddy:2.10.2-alpine
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:80:80"
      - "${BIND_ADDRESS:-0.0.0.0}:443:443"
    cap_add: [NET_BIND_SERVICE]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      TLS_MODE: ${TLS_MODE:-internal}
      DASHBOARD_USER: ${DASHBOARD_USER:?Run scripts/init-env.sh to create .env}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:?Run scripts/init-env.sh to create .env}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    <<: *hardened
    build: ./backend
    environment:
      DB_PATH: /data/esd.db
      AGENT_TOKEN: ${AGENT_TOKEN:?Run scripts/init-env.sh to create .env}
      SOFTWARE_ALLOWLIST: ${SOFTWARE_ALLOWLIST:-}
      SAMPLE_DATA: ${SAMPLE_DATA:-false}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
    volumes:
      - dashboard-data:/data
    tmpfs: [/tmp]
    networks: [web, it, sales, finance]
    mem_limit: 512m
    pids_limit: 200
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # The endpoints stand in for lab machines that attackers (and drills) can touch,
  # so they are deliberately not read-only or capability-stripped.
  endpoint-it: &endpoint
    build: ./collector
    environment: &endpoint-env
      BACKEND_URL: http://backend:8000
      AGENT_TOKEN: ${AGENT_TOKEN:?Run scripts/init-env.sh to create .env}
      DEPARTMENT: IT
    networks: [it]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 200
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/last_checkin') < 60 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  endpoint-sales:
    <<: *endpoint
    environment:
      <<: *endpoint-env
      DEPARTMENT: Sales
    networks: [sales]

  endpoint-finance:
    <<: *endpoint
    environment:
      <<: *endpoint-env
      DEPARTMENT: Finance
    networks: [finance]

networks:
  web:
  it:
  sales:
  finance:

volumes:
  dashboard-data:
  caddy-data:
  caddy-config:
